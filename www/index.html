function sbSet(r){sbs.adm={at:r.access_token,rt:r.refresh_token,exp:r.expires_at||(Date.now()/1000+3000)};try{localStorage.setItem('qn_adm',JSON.stringify(sbs.adm))}catch(e){}}
function sbLogout(){sbs.adm=null;try{localStorage.removeItem('qn_adm')}catch(e){}}
async function admTok(){
 const s=sbs.adm;if(!s)return null;
 if(s.exp>Date.now()/1000+60)return s.at;
 try{sbSet(await sbf('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.rt})}));return sbs.adm.at}
 catch(e){sbLogout();return null}
}
async function sbIsAdmin(){const t=await admTok();if(!t)return false;try{return (await sbf('/rest/v1/rpc/is_admin',{method:'POST',body:'{}'},t))===true}catch(e){return false}}
async function sbLogin(email,pw){sbSet(await sbf('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.trim(),password:pw})}));return sbIsAdmin()}
const sbLis={};
const sbQ=n=>{clearTimeout(sbQ[n]);sbQ[n]=setTimeout(()=>sbLis[n]&&sbLis[n](),600)};
async function sbAll(n,tok){
 let out=[],off=0;
 for(;;){
  const rows=await sbf('/rest/v1/'+n+'?select=id,data&order=id.asc&limit=1000&offset='+off,{},tok);
  out=out.concat(rows);
  if(rows.length<1000)break;
  off+=1000;
 }
 return out;
}
const sbdb={
 collection:n=>({onSnapshot:(cb,eb)=>{
  const load1=async()=>{try{const t=n==='stats'?await admTok():null;const rows=await sbAll(n,t);cb({docs:rows.map(r=>({id:r.id,data:()=>r.data}))})}catch(e){eb&&eb(e)}};
  sbLis[n]=load1;load1();return()=>{delete sbLis[n]}}}),
 doc:p=>{const i=p.indexOf('/'),n=p.slice(0,i),id=p.slice(i+1);return{
  set:async d=>{
   if(n==='stats'){await sbf('/rest/v1/rpc/upsert_stat',{method:'POST',body:JSON.stringify({p_id:id,p_data:d})});return}
   const t=await admTok();if(!t)throw new Error('auth');
   await sbf('/rest/v1/'+n+'?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,data:d})},t);sbQ(n)},
  delete:async()=>{const t=await admTok();if(!t)throw new Error('auth');await sbf('/rest/v1/'+n+'?id=eq.'+encodeURIComponent(id),{method:'DELETE'},t);sbQ(n)}}}
};

function Coll({title,items,onOpen,back}){
 const gs=CH.filter(c=>items.some(q=>q.ch===c.id)).map(c=>({c,l:items.filter(q=>q.ch===c.id)}));
 return<div className="space-y-4 anim">
  <div className="flex items-center justify-between"><button onClick={back} className={sec}><I n="arr" c="w-4 h-4"/>رجوع</button><h2 className="font-bold">{title}</h2><span className="w-16"/></div>
  <p className="text-sm text-mut">{items.length} سؤال في {gs.length} فصل</p>
  {!gs.length&&<div className={card+" p-8 text-center text-mut"}>لا توجد أسئلة هنا بعد.</div>}
  {gs.map(g=><button key={g.c.id} onClick={()=>onOpen(g.l,title+" — "+g.c.name)} className={card+" w-full p-4 flex items-center justify-between hover:bg-accS transition active:scale-[.99]"}><div className="text-right"><div className="font-bold">{g.c.name}</div><div className="text-xs text-mut mt-1">اضغط لعرض الأسئلة</div></div><span className="min-w-9 h-9 px-2 rounded-xl bg-accS text-acc grid place-items-center font-bold">{g.l.length}</span></button>)}
 </div>;
}
const dn=n=>/^\s*(د\.|د\s|دكتور)/.test(n)?n:'د. '+n;
function App(){
 const[loc,setLoc]=useState(()=>load("qn_q",DEMO)),[pg,setPg]=useState(()=>load("qn_p",{})),[bm,setBm]=useState(()=>load("qn_b",[])),[nt,setNt]=useState(()=>load("qn_n",{}));
 const[th,setTh]=useState(()=>load("qn_t","light"));
 const[db,setDb]=useState(null),[dq,setDq]=useState(()=>load('qn_cq',null)),[u,setU]=useState(null),[sm,setSm]=useState(null),[dbSub,setDbSub]=useState(()=>load('qn_cs',null)),[dbCh,setDbCh]=useState(()=>load('qn_cc',null)),[sd,setSd]=useState(false),[locS,setLocS]=useState(()=>load('qn_s',SUBJ0)),[locC,setLocC]=useState(()=>load('qn_c',CH0)),[adm,setAdm]=useState(false),[ae,setAe]=useState(''),[bz2,setBz2]=useState(false),[pe,setPe]=useState(false),[nm,setNm]=useState(()=>load("qn_name","")),[nin,setNin]=useState(""),[st,setSt]=useState([]),[pwh,setPwh]=useState(()=>load("qn_pw",null)),[uid,setUid]=useState("local"),[gate,setGate]=useState(false),[pv,setPv]=useState(""),[msg,setMsg]=useState("");
 const[sem,setSem]=useState(1),[v,setV]=useState({n:"home"});
 useEffect(()=>{document.documentElement.dataset.theme=th;save("qn_t",th)},[th]);
 useEffect(()=>save("qn_q",loc),[loc]);useEffect(()=>save("qn_p",pg),[pg]);useEffect(()=>save("qn_b",bm),[bm]);useEffect(()=>save("qn_n",nt),[nt]);
 useEffect(()=>{
  setDb(sbdb);setUid(DEV);setSd(true);
  const pq=x=>x.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.n||0)-(b.n||0));
  sbdb.collection('questions').onSnapshot(x=>{const r=pq(x);setDq(r);save('qn_cq',r)},()=>{});
  sbdb.collection('subjects').onSnapshot(x=>{const r=pq(x);setDbSub(r);save('qn_cs',r)},()=>{});
  sbdb.collection('chapters').onSnapshot(x=>{const r=pq(x);setDbCh(r);save('qn_cc',r)},()=>{});
 },[]);
 useEffect(()=>{if(adm)sbdb.collection('stats').onSnapshot(x=>setSt(x.docs.map(d=>({...d.data(),id:d.id}))),()=>{})},[adm]);
 useEffect(()=>{save('qn_name',nm);save('qn_s',locS);save('qn_c',locC)},[nm,locS,locC]);
 useEffect(()=>{if(!db||!nm||uid==='local')return;const h=setTimeout(()=>{const m={};Object.keys(pg).forEach(k=>m[k]=pg[k].ok?1:0);db.doc('stats/'+uid).set({name:nm,last:Date.now(),pg:m}).catch(()=>{})},800);return()=>clearTimeout(h)},[db,nm,uid,pg]);
 const qs=dq||DEMO;
 const subs=dbSub||SUBJ0,chs=dbCh||CH0;
 SUBJ=subs;CH=chs;
 const adminOK=adm;
 const openGate=async()=>{if(await sbIsAdmin()){setAdm(true);setV({n:'admin'})}else setGate(true)};
 const seed=async()=>{};
 const onSave=async(f,ed)=>{setMsg("");try{
  if(db){await seed();const id=ed||"q"+Date.now(),old=qs.find(x=>x.id===ed);await db.doc("questions/"+id).set({n:Date.now(),...(old||{}),...f,id,sub:SB(f.ch),m:!!ed||!!(old&&old.m)})}
  else setLoc(l=>ed?l.map(q=>q.id===ed?{...q,...f,sub:SB(f.ch),m:true}:q):[...l,{...f,id:"q"+Date.now(),n:Date.now(),sub:SB(f.ch),m:false}])}catch(e){setMsg("تعذر الحفظ: لا تملك صلاحية التحرير.")}};
 const onDel=async id=>{setMsg("");try{if(db){await seed();await db.doc("questions/"+id).delete()}else setLoc(l=>l.filter(q=>q.id!==id))}catch(e){setMsg("تعذر الحذف: لا تملك صلاحية التحرير.")}};
 const ctx={pg,setPg,bm,setBm,nt,setNt,sm};
 const stat=sid=>{const l=qs.filter(q=>q.sub===sid),d=l.filter(q=>pg[q.id]).length;return{l,d,p:l.length?Math.round(d/l.length*100):0}};
 const mine={};Object.keys(pg).forEach(k=>mine[k]=pg[k].ok?1:0);
 const sts=db?st:[{id:'me',name:nm,last:Date.now(),pg:mine}];
 const setPw=async p=>{try{const h=await H(p);if(db)await db.doc('config/admin').set({h});setPwh(h);save('qn_pw',h);return true}catch(e){return false}};
 const wrt=async fn=>{setMsg('');try{await seed();await fn();return true}catch(e){setMsg('تعذر الحفظ: لا تملك صلاحية الكتابة.');return false}};
 const addSub=s=>wrt(async()=>{const id='s'+Date.now()+(s.k??''),o={id,sem:s.sem,name:s.name,ic:'book',em:s.em,n:Date.now()+(s.k||0)};if(db)await db.doc('subjects/'+id).set(o);else setLocS(l=>[...l,o])});
 const delSub=id=>wrt(async()=>{const cs=CH.filter(c=>c.sub===id).map(c=>c.id),qi=qs.filter(q=>q.sub===id).map(q=>q.id);if(db)await Promise.all([db.doc('subjects/'+id).delete(),...cs.map(c=>db.doc('chapters/'+c).delete()),...qi.map(q=>db.doc('questions/'+q).delete())]);else{setLocS(l=>l.filter(s=>s.id!==id));setLocC(l=>l.filter(c=>c.sub!==id));setLoc(l=>l.filter(q=>q.sub!==id))}});
 const addCh=(sub,name)=>wrt(async()=>{const id='c'+Date.now(),o={id,sub,name,n:Date.now()};if(db)await db.doc('chapters/'+id).set(o);else setLocC(l=>[...l,o])});
 const delCh=id=>wrt(async()=>{const qi=qs.filter(q=>q.ch===id).map(q=>q.id);if(db)await Promise.all([db.doc('chapters/'+id).delete(),...qi.map(q=>db.doc('questions/'+q).delete())]);else{setLocC(l=>l.filter(c=>c.id!==id));setLoc(l=>l.filter(q=>q.ch!==id))}});
 const onBulk=async arr=>{setMsg('');try{if(db){await seed();for(let i=0;i<arr.length;i+=10)await Promise.all(arr.slice(i,i+10).map((f,k)=>{const id='q'+Date.now()+'_'+(i+k);return db.doc('questions/'+id).set({...f,id,n:Date.now()+i+k,sub:SB(f.ch),m:false})}))}else setLoc(l=>[...l,...arr.map((f,k)=>({...f,id:'q'+Date.now()+'_'+k,n:Date.now()+k,sub:SB(f.ch),m:false}))]);return true}catch(e){setMsg('تعذر الاستيراد: لا تملك صلاحية الكتابة.');return false}};
 const greet=nm&&<button onClick={()=>{setNin(nm);setNm('')}} className='mb-4 text-mut text-sm'>أهلاً، <b className='text-fg'>{dn(nm)}</b> 👋</button>;
 let body;
 const colQ=v.n==="col"?qs.filter(q=>q.sub===v.s&&(v.kind==="bm"?bm.includes(q.id):v.kind==="xc"?(pg[q.id]&&!pg[q.id].ok):nt[q.id])):[];
 if(v.n==="admin")body=<Admin qs={qs} sts={sts} setPw={setPw} onBulk={onBulk} S={{subs,chs,addSub,delSub,addCh,delCh}} onSave={onSave} onDel={onDel} msg={msg} back={()=>setV({n:"home"})}/>;
 else if(v.n==="col")body=<Coll title={v.t} items={colQ} back={()=>setV({n:"subj",s:v.s})} onOpen={(li,t)=>setV({n:"quiz",ids:li.map(q=>q.id),t,s:v.s,k:Date.now(),rv:true,bk:{n:"col",s:v.s,kind:v.kind,t:v.t}})}/>;
 else if(v.n==="quiz")body=<Feed key={v.k} review={v.rv} list={v.ids.map(id=>qs.find(q=>q.id===id)).filter(Boolean)} title={v.t} ctx={ctx} back={()=>setV(v.bk||{n:"subj",s:v.s})}/>;
 else if(v.n==="subj"){
  const S=SUBJ.find(x=>x.id===v.s),{l,d,p}=stat(S.id);
  const open=(li,t,rv)=>setV({n:"quiz",ids:li.map(q=>q.id),t,s:S.id,k:Date.now(),rv});
  const sx=[["bm","المحفوظات","text-acc",l.filter(q=>bm.includes(q.id))],["xc","أخطائي","text-badc",l.filter(q=>pg[q.id]&&!pg[q.id].ok)],["pen","الملاحظات","text-okc",l.filter(q=>nt[q.id])],["ai","المعدّلة","text-acc",l.filter(q=>q.m)]];
  body=<div className="space-y-4">
   <button onClick={()=>setV({n:"home"})} className={sec}><I n="arr" c="w-4 h-4"/>الرئيسية</button>
   <div className={card+" p-5 space-y-3"}><h2 className="text-xl font-bold flex items-center gap-2">{S.em?<span className="text-3xl">{S.em}</span>:<I n={S.ic} c="w-6 h-6 text-acc"/>}{S.name}</h2>
    <div className="grid grid-cols-3 text-center text-sm text-mut"><div><div className="text-2xl font-bold text-fg">{l.length}</div>إجمالي الأسئلة</div><div><div className="text-2xl font-bold text-okc">{d}</div>المجابة</div><div><div className="text-2xl font-bold text-acc">{p}%</div>الإنجاز</div></div><Bar v={p}/></div>
   <div className="grid grid-cols-4 gap-2">{sx.map(([ic,n,c,li])=><button key={n} onClick={()=>ic==="ai"?open(li,n,true):setV({n:"col",s:S.id,kind:ic,t:n})} className={card+" p-3 text-center hover:bg-accS transition"}><I n={ic} c={"w-6 h-6 mx-auto "+c}/><div className="text-xs font-semibold mt-1">{n}</div><div className="text-xs text-mut">{li.length}</div></button>)}</div>
   <h3 className="font-bold pt-1">الفصول</h3>
   {!CH.some(c=>c.sub===S.id)&&<p className="text-center text-mut py-6">لا توجد فصول بعد.</p>}
   {CH.filter(c=>c.sub===S.id).map(c=>{const cl=l.filter(q=>q.ch===c.id),cd=cl.filter(q=>pg[q.id]).length;return<button key={c.id} onClick={()=>open(cl,c.name)} className={card+" w-full p-4 text-right hover:bg-accS transition space-y-2"}><div className="flex justify-between"><span className="font-semibold">{c.name}</span><span className="text-xs text-mut">{cd}/{cl.length}</span></div><Bar v={cl.length?cd/cl.length*100:0} c="bg-okc"/></button>})}
  </div>;
 } else body=<div className="space-y-4">
  <div className="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-accS">{[1,2].map(s=><button key={s} onClick={()=>setSem(s)} className={"py-2.5 rounded-xl font-semibold transition "+(sem===s?"bg-acc text-white":"text-mut")}>{s===1?"الفصل الأول":"الفصل الثاني"}</button>)}</div>
  {!SUBJ.some(s=>s.sem===sem)&&<p className="text-center text-mut py-12">لا توجد مواد في هذا الفصل بعد.</p>}
  {SUBJ.filter(s=>s.sem===sem).map(s=>{const{l,p}=stat(s.id);return<button key={s.id} onClick={()=>setV({n:"subj",s:s.id})} className={card+" w-full p-5 text-right hover:-translate-y-0.5 transition space-y-3"}><div className="w-14 h-14 rounded-2xl bg-gradient-to-br from-accS to-bg border border-bd grid place-items-center text-acc text-3xl shadow-sm">{s.em||<I n={s.ic} c="w-6 h-6"/>}</div><div className="font-bold text-lg">{s.name}</div><div className="text-xs text-mut">{l.length} سؤال • {p}% منجز</div><Bar v={p} c="bg-okc"/></button>})}</div>;
 return<div className="max-w-2xl mx-auto p-4 pb-16">
  <header className="flex items-center justify-between mb-5"><div className="flex items-center gap-2 select-none" onPointerDown={()=>{window._lp=setTimeout(()=>openGate(),800)}} onPointerUp={()=>clearTimeout(window._lp)} onPointerLeave={()=>clearTimeout(window._lp)}><div className="w-10 h-10 rounded-xl bg-gradient-to-br from-violet-500 to-emerald-400 grid place-items-center text-white font-bold text-xl" dir="ltr">Q</div><h1 className="text-2xl font-bold text-acc" dir="ltr">Q_Nest</h1></div>
   <div className="flex gap-2"><button aria-label="تبديل الوضع" onClick={()=>setTh(th==="dark"?"light":"dark")} className={sec}><I n={th==="dark"?"sun":"moon"} c="w-4 h-4"/>{th==="dark"?"فاتح":"داكن"}</button>
   </div></header>{greet}{body}
  {gate&&<div className="fixed inset-0 bg-black/60 grid place-items-center p-4 z-50"><div className={card+" p-5 w-full max-w-sm space-y-3"}><h4 className="font-bold">صفحة محمية</h4>
   <p className='text-sm text-mut'>تسجيل دخول الأدمن</p><input type='email' dir='ltr' placeholder='البريد الإلكتروني' value={ae} onChange={e=>{setAe(e.target.value);setPe(false)}} className='w-full bg-bg border border-bd rounded-xl px-3 py-2 text-center'/><input type='password' dir='ltr' placeholder='كلمة السر' value={pv} onChange={e=>{setPv(e.target.value);setPe(false)}} className='w-full bg-bg border border-bd rounded-xl px-3 py-2 text-center'/>{pe&&<p className='text-xs text-badc'>بيانات الدخول غير صحيحة أو الحساب ليس أدمن</p>}
   <div className="flex gap-2"><button disabled={bz2} className={pri+' flex-1 disabled:opacity-50'} onClick={async()=>{setBz2(true);let g=false;try{g=await sbLogin(ae,pv)}catch(e){g=false}setBz2(false);if(g){setAdm(true);setGate(false);setPv('');setV({n:'admin'})}else setPe(true)}}>{bz2?'...':'دخول'}</button><button className={sec+' flex-1'} onClick={()=>setGate(false)}>إغلاق</button></div></div></div>}
  {!nm&&<div className='fixed inset-0 bg-black/70 grid place-items-center p-4 z-[60]'><div className={card+' p-6 w-full max-w-sm space-y-4 text-center'}><div className='text-4xl'>👋</div><h3 className='font-bold text-lg'>مرحباً بك في <span dir='ltr'>Q_Nest</span></h3><p className='text-sm text-mut'>ما اسمك؟</p><input autoFocus value={nin} onChange={e=>setNin(e.target.value)} className='w-full bg-bg border border-bd rounded-xl px-3 py-2 text-center' placeholder='اسم المستخدم'/><p className='text-xs text-mut'>سيظهر اسمك: {dn(nin.trim()||'اسمك')}</p><button disabled={!nin.trim()} className={pri+' w-full disabled:opacity-40'} onClick={()=>setNm(nin.trim())}>ابدأ</button></div></div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
