name: Generate Key
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore qnest.jks \
            -alias qnest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass QnestPass2026 \
            -keypass QnestPass2026 \
            -dname "CN=QNest"
          base64 -w 0 qnest.jks > key.b64
      - uses: actions/upload-artifact@v4
        with:
          name: key
          path: key.b64
