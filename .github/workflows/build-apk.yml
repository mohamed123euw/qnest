name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/qnest.jks
          ls -l android/app/qnest.jks
      - name: Configure signing
        run: |
          cat >> android/app/build.gradle <<'EOF2'

          android {
              signingConfigs {
                  qnest {
                      storeFile file("qnest.jks")
                      storePassword "QnestPass2026"
                      keyAlias "qnest"
                      keyPassword "QnestPass2026"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.qnest
                  }
              }
          }
          EOF2
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Show signature
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -i SHA256
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk QNest.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Q_Nest v${{ github.run_number }}
          files: QNest.apk
